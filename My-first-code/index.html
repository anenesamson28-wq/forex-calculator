<!DOCTYPE html>
<html>
<head>
    <title>My Coding Journey</title>
    <style>
        /* 1. This styles the background and font for the whole page */
        body {
            background-color: #1e1e24; /* Dark sleek background */
            color: #ffffff; /* Crisp white text */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 2. This creates a clean, centered container card for your calculator */
        .calculator-card {
            background-color: #2a2a35; /* Slightly lighter card color */
            padding: 30px;
            border-radius: 12px; /* Smooth rounded corners */
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3); /* Soft dropdown shadow */
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* 3. This designs your inputs to look like a modern app */
        input {
            width: 90%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 2px solid #4e4e61;
            border-radius: 6px;
            background-color: #1e1e24;
            color: white;
            font-size: 16px;
        }

        /* 4. This makes your button look sharp and interactive */
        button {
            background-color: #28a745; /* Vibrant neon blue/teal button */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 95%;
            transition: 0.2s;
        }

        button:hover {
            background-color: #007a80; /* Darkens slightly when you hover your mouse */
        }
    </style>
</head>
<body>

    <!-- We wrapped your inputs inside a single card container -->
    <div class="calculator-card">
        <h1>Forex Risk Calculator</h1>
        <p style="color: #a0a0b0;">Built by Architect Anene Chinonso</p>
        <hr style="border: 1px solid #4e4e61; margin-bottom: 20px;">

        <label for="balanceInput">Enter Account Balance ($): </label>
        <input type="number" id="balanceInput" placeholder="e.g. 5000">

        <label for="riskInput">Enter Risk Percentage (%): </label>
        <input type="number" id="riskInput" placeholder="e.g. 2" step="0.01">
        
        <button onclick="calculateLiveRisk()">Calculate Risk</button>
        <h2 id="riskResult" style="color: #00adb5; margin-top: 25px;"></h2>
    </div>

    <script>
        function calculateLiveRisk() {
            let accountBalance = document.getElementById("balanceInput").value;
            let riskPercent = document.getElementById("riskInput").value; 
            
            let amountToRisk = accountBalance * (riskPercent / 100);
            let potentialReward = amountToRisk * 3;

            document.getElementById("riskResult").innerText = "Risk: $" + amountToRisk + " | Target Reward: $" + potentialReward;
        }
    </script>
</body>
</html>
